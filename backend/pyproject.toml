[project]
name = "ai-video-editor-backend"
version = "0.1.0"
description = "AI Video Editor backend - FastAPI service and Claude agent network"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "moviepy>=2.1.1",
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20240930",
    "python-jose[cryptography]>=3.3.0",
    "websockets>=14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "types-boto3>=1.0.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by black
    "RUF001", # ambiguous-unicode-character — our prompts are intentionally Hebrew
    "RUF002", # ambiguous unicode in docstrings — same reason
    "RUF003", # ambiguous unicode in comments — same reason
    "B008",   # function-call-in-default-arg: canonical FastAPI Path/File/Query pattern
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "alembic/"]

[[tool.mypy.overrides]]
# Celery does not ship type stubs and ``@shared_task`` erases the
# wrapped function's signature. Skip strict-decorator checks on the
# tasks package so the rest of the code stays under strict mode
# without a per-call ``# type: ignore`` rash.
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.queue.tasks.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# boto3's ``BaseClient`` exposes service methods dynamically; without
# the (heavy, optional) ``boto3-stubs[s3]`` extra mypy reports every
# call as ``attr-defined``. Allow that on the storage adapter only -
# the rest of the codebase still benefits from strict mode.
module = ["app.storage.s3"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/migrations/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
