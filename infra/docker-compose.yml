# Local infrastructure for the AI Video Editor.
#
# Services:
#   postgres - the relational database
#   redis    - cache and Celery broker / result backend
#   minio    - S3-compatible object storage for assets and renders
#   minio-bootstrap - one-shot job that creates the buckets if missing
#
# Bring it up with:
#   docker compose -f infra/docker-compose.yml up -d
#
# All ports are forwarded to localhost so the backend can reach them
# directly with the defaults defined in `app.core.config.Settings`.

name: ai-video-editor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videoeditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoeditor}
      POSTGRES_DB: ${POSTGRES_DB:-videoeditor}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videoeditor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-videoeditor}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-videoeditor}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the asset and render buckets on first boot.
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-videoeditor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-videoeditor}
      S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:-assets}
      S3_BUCKET_RENDERS: ${S3_BUCKET_RENDERS:-renders}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
        mc mb --ignore-existing local/$$S3_BUCKET_ASSETS &&
        mc mb --ignore-existing local/$$S3_BUCKET_RENDERS &&
        echo 'buckets ready'
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
